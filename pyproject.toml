[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orrery"
version = "0.2.0"
description = "Orrery: stateful multi-tier cognitive cycles for long-horizon agents"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kirk LaSalle" }
]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/kirklasalle/orrery"
Repository = "https://github.com/kirklasalle/orrery"
Changelog = "https://github.com/kirklasalle/orrery/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Ed25519 operator signing. Optional at runtime: without it Orrery falls back to HMAC and
# says so, and refuses outright if a policy requires asymmetric proof.
signing = [
    "cryptography>=42.0",
]
telemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "cryptography>=42.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orrery*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "asyncio: mark test as async test",
]

[tool.coverage.run]
source = ["orrery"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
