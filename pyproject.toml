[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognition-cycles"
version = "0.1.0"
description = "Cognition Cycles: Stateful multi-tier cognitive state loops replacing basic ReAct loops"
readme = "README.md"
authors = [
    { name = "Antigravity Engineering", email = "dev@cognitioncycles.org" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
